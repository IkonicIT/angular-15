<header class="app-header navbar">
  <div class="col-12">
    <div class="row">
            <div class="col-5 col-md-2 col-sm-3 pr-0 iphone-2">
        <div class="d-flex align-items-center">
  <a class="navbar-brand" href="#">
  </a>
  <button
    class="navbar-toggler ms-2"
    type="button"
    appSidebarToggler
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>
  </div>
      </div>

      <div class="col-12 col-md-5 col-lg-7 margin-name-0mobile col-sm-4">
        <span style="color: black; font-weight: bold">Current Roles:</span>
        <span style="margin-left: 3px; color: #e02725; font-weight: bold"
          [innerHTML]="roles | uppercase"
        ></span>
      </div>

      <div
        class="col-md-3 col-lg-2 col-10 margin-name col-sm-3 iphone-absolute"
        style="float: right;"

      >
        <ul class="nav navbar-nav d-flex justify-content-end">
          <li class="nav-item dropdown" dropdown placement="bottom right">
            <a
              class="nav-link bew"
              data-toggle="popover"
              href="#"
              role="button"
              aria-haspopup="true"
              aria-expanded="false"
            >
            </a>
          </li>

          <li class="nav-item">
            <span
              style="color: #e02725; font-weight: bold; "
              [innerHTML]="userName | uppercase"
            >
            </span>
          </li>
        </ul>
      </div>

      <div class="col-2 col-md-1 col-sm-1 margin-name iphone-absolute r-0">
        <ul class="nav navbar-nav">
          <li class="nav-item dropdown">
            <a
              id="simple-dropdown"
              class="nav-link dropdown-toggle"
              href="#"
              role="button"
              aria-haspopup="true"
              aria-expanded="false"
              (click)="toggleDropdown($event)"
            >
              <span class="navbar-toggler-icon"></span>
            </a>

            <div
              class="dropdown-menu dropdown-menu-right"
              [ngClass]="{ show: isDropdownOpen }"
            >
              <div class="dropdown-header text-center">
                <strong>Settings</strong>
              </div>

              <div *ngIf="highestRank > 0">
                <a
                  class="dropdown-item"
                  href="javascript:void(0)"
                  [routerLink]="['/profile/myProfile']"
                >
                  <i class="fa fa-user"></i>My Profile</a
                >
              </div>

              <a class="dropdown-item gg" (click)="logout()">
                <i class="fa fa-lock"></i> Logout
              </a>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <ul class="nav navbar-nav ml-auto">
   
    <li class="nav-item dropdown" dropdown placement="bottom right">
      <div
        class="dropdown-menu dropdown-menu-right"
        style="margin-right: 5%; margin-top: 28%"
        *dropdownMenu
        aria-labelledby="simple-dropdown"
      >
        <div class="dropdown-header text-center">
          <strong>Search</strong>
        </div>
        <form>
          <div class="form-group">
            <input class="form-control" placeholder="Find Tag#" type="text" />
          </div>
          <div class="form-group">
            <input class="form-control" placeholder="Item Type" type="text" />
          </div>
          <button type="submit" class="btn btn-primary">Go</button>
          <button type="submit" class="btn btn-primary">Advanced Search</button>
        </form>
      </div>
    </li>

  </ul>
</header>
