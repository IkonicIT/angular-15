<ngx-spinner
  bdColor="rgba(51, 51, 51, 0.8)"
  size="default"
  color="#fff"
  type="ball-clip-rotate"
></ngx-spinner>

<div class="container-fluid p-0">
  <app-header></app-header>

  <div class="side-bar-margin">
    <app-sidebar></app-sidebar>
  </div>

  <main class="main">
    <div class="row top-bar">
      <div class="col-12 col-md-12 col-lg-2 breadcrumb-col">
        <ol class="breadcrumb custom-breadcrumb">
          <app-breadcrumbs></app-breadcrumbs>
        </ol>
      </div>

      <div class="col-12 col-md-12 col-lg-10 top-controls">
        <a
          *ngIf="userSelectedCompany.companyId != 0 && !noLogo"
          class="logo-link"
        >
          <img [src]="imageSource" class="company-logo" />
        </a>

        <div
          class="btn-group float-right margin-new-top company-select"
          data-bs-placement="bottom"
          data-bs-toggle="tooltip"
          title="click here to Manage Companies"
        >
          <ngx-select-dropdown
            [(ngModel)]="userSelectedCompany1"
            (change)="selectRootCompany($event)"
            [config]="ngxconfig"
            [options]="userCompanies"
            tabindex="0"
            class="text-overflow-button"
          ></ngx-select-dropdown>

          <alert type="danger" *ngIf="highestRank == 0">
            This account has been disabled for this company. <br />
          </alert>
        </div>

        <input
          [(ngModel)]="itemTag"
          [disabled]="userSelectedCompany.companyId == 0 || highestRank == 0"
          [typeahead]="suggessions"
          (ngModelChange)="getSuggessions(itemTag)"
          typeaheadOptionField="tag"
          (keyup.enter)="navigateToItems()"
          placeholder="#Tag"
          class="tag-input"
        />

        <div class="dropdown-wrapper99">
  <app-dropdown-treeview-select
    [items]="items"
    [(value)]="value"
    (valueChange)="selectRootItemType($event)"
    class="custom-dropdown99"
  ></app-dropdown-treeview-select>
  <span class="custom-dropdown-arrow99"></span>
</div>


        <button
          (click)="navigateToItems()"
          [disabled]="userSelectedCompany.companyId == 0 || highestRank == 0"
          class="btn btn-danger go-btn"
        >
          GO
        </button>

        <div class="action-buttons">
 <button
  *ngIf="masterSearchFlag == 'false'"
  (click)="navigateToAdvanceItemSearch()"
  [disabled]="userSelectedCompany.companyId == 0 || highestRank == 0 || isHierarchyLoading"
  class="btn btn-danger advanced-btn"
>
  Advanced search
</button>

  <button
    *ngIf="isOwnerAdmin == 'true' && userSelectedCompany.companyId == 0"
    (click)="navigateToMasterSearch()"
    class="btn btn-danger"
  >
    Master search
  </button>

  <button
    *ngIf="isOwnerAdmin == 'true' && userSelectedCompany.companyId == 0"
    (click)="navigateToMasterPieCharts()"
    class="btn btn-danger master-pie-btn"
  >
    Master PieCharts
  </button>
</div>
      </div>
    </div>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>

  <div>
    <app-footer></app-footer>
  </div>
</div>
