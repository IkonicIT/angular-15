<div class="container mt-4">
  <div class="btn-group" dropdown [isOpen]="isOpen">
    <!-- Dropdown toggle button with arrow -->
    <button dropdownToggle type="button" class="btn btn-primary dropdown-toggle">
      Select Item
    </button>

    <!-- Dropdown menu -->
    <ul *dropdownMenu class="dropdown-menu">
      <li *ngFor="let item of items">
        <a class="dropdown-item" href="#">{{ item }}</a>
      </li>
    </ul>
  </div>

  <!-- Control buttons -->
  <div class="mt-3">
    <button class="btn btn-success me-2" (click)="openDropdown()">
      Open Dropdown
    </button>
    <button class="btn btn-danger me-2" (click)="closeDropdown()">
      Close Dropdown
    </button>
    <button class="btn btn-secondary" (click)="toggleDropdown()">
      Toggle Dropdown
    </button>
  </div>
</div>
