<div class="col-lg-12 mobile-padding col-padding">
  <div class="card">
    <div class="card-header">
      <strong class="text-danger">Tracrat Manual</strong>
    </div>
    <div class="card-body">
      <!-- Success Alert -->
      <alert
        *ngIf="index1 > 0"
        type="success"
        [dismissible]="dismissible"
      >
        Manual uploaded successfully.
      </alert>

      <!-- Error Alert -->
      <alert
        *ngIf="index1 == -1"
        type="danger"
        [dismissible]="dismissible"
      >
        Please Upload Manual.
      </alert>

      <!-- Manual Upload Section -->
      <div class="row text-center">
        <div class="form-group col-sm-12">
          <a
            href="javascript:void(0)"
            (click)="getManual()"
            class="d-inline-block border p-1"
            data-bs-placement="bottom"
            data-bs-toggle="tooltip"
            title="click here to view Manual"
            >Tracrat Manual</a
          >

          <input
            *ngIf="isOwnerAdmin === 'true'"
            type="file"
            class="form-control mt-2"
            (change)="fileChangeListener($event)"
            id="file"
          />

          <button
            *ngIf="isOwnerAdmin === 'true'"
            type="button"
            (click)="saveManual()"
            class="btn btn-primary mt-2 btn-group"
            data-bs-placement="bottom"
            data-bs-toggle="tooltip"
            title="Click here to upload new manual"
          >
            Upload
          </button>
        </div>
      </div>

      <!-- Company Documents Section -->
      <div class="mb-2">
        <strong class="card-text text-danger">Company Documents: </strong>
      </div>

      <!-- Pagination Option -->
        <div class="select-pagination-option">
            <div class="float-left">
              <span
                >Show
                <select [(ngModel)]="itemsForPagination">
                  <option>5</option>
                  <option>10</option>
                  <option>25</option>
                  <option>50</option>
                </select>
                entries
              </span>
            </div>
          </div>

      <!-- Search -->
      <div class="float-right div-search mb-2">
        <span>Search : </span>
        <input [(ngModel)]="documentFilter" class="form-control d-inline w-auto" />
      </div>

      <!-- Documents Table -->
      <table class="table table-hover table-outline mb-0">
        <thead class="thead-light">
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Added</th>
            <th>By</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="
              let document of documents
                | filterBy : ['description', 'dateAddedOn', 'addedBy'] : documentFilter
                | paginate : { itemsPerPage: itemsForPagination, currentPage: p }
            "
          >
            <td>
              <a
                href="javascript:void(0)"
                (click)="download(document)"
                data-bs-placement="bottom"
                data-bs-toggle="tooltip"
                title="click here to view this Company Document"
              >
                {{ document.fileName }}
              </a>
            </td>
            <td>{{ document.description }}</td>
            <td>{{ document.dateAdded | date : 'MM/dd/yyyy' }}</td>
            <td>{{ document.addedBy }}</td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination Controls -->
      <pagination-controls
        class="my-pagination"
        (pageChange)="p = $event"
        [autoHide]="true"
      ></pagination-controls>
    </div>
  </div>
</div>

<!-- Loader -->
<div *ngIf="loader" class="loader-overlay">
  <div class="loader"></div>
</div>
