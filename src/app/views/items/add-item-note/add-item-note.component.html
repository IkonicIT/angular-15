<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <p class="card-text">
            Add Notes for Item : {{ item.typeName }} '{{ item.tag }}'
          </p>

          <alert *ngIf="index > 0" type="success" [dismissible]="dismissible">
            Item Notes saved successfully.
          </alert>

          <alert *ngIf="index === -1" type="danger" [dismissible]="dismissible">
            Please Enter Title and Date
          </alert>

          <div class="modal-body mobile-padding">
            <div class="col-sm-12 mobile-padding">
              <div class="card">
                <form
                  #f="ngForm"
                  (ngSubmit)="f.form.valid && saveItemNote()"
                  novalidate
                >
                  <div class="card-body">
                    <div class="row">
                      
                      <div class="form-group col-sm-6">
                        <label for="title">
                          Title <strong class="text-danger">*</strong>
                        </label>
                        <input
                          type="hidden"
                          [(ngModel)]="model.journalId"
                          name="journalId"
                        />
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.entityName"
                          name="title"
                          id="title"
                          placeholder="Enter Title"
                          required
                        />
                      </div>

                      <div class="form-group col-sm-6">
                        <label for="date">
                          Date <strong class="text-danger">*</strong>
                        </label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.effectiveOn"
                          name="date"
                          id="date"
                          placeholder="Enter Date"
                          bsDatepicker
                          required
                        />
                      </div>
                    </div>

                    <!-- JOB & PO -->
                    <div class="row">
                      <div class="form-group col-sm-6">
                        <label for="job">JOB Number</label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.jobNumber"
                          name="job"
                          id="job"
                          placeholder="Enter JOB Number"
                        />
                      </div>
                      <div class="form-group col-sm-6">
                        <label for="po">PO Number</label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.poNumber"
                          name="po"
                          id="po"
                          placeholder="Enter PO Number"
                        />
                      </div>
                    </div>

                    <!-- Details -->
                    <div class="row">
                      <div class="form-group col-sm-12">
                        <label for="details">Details</label>
                        <textarea
                          id="details"
                          class="form-control"
                          rows="2"
                          [(ngModel)]="model.entry"
                          name="details"
                          placeholder="Enter Description"
                        ></textarea>
                      </div>
                    </div>

                    <!-- Buttons -->
                    <div class="row">
                      <div class="form-group col-sm-12 text-center">
                        <button
                          class="btn btn-primary"
                          type="submit"
                          data-bs-toggle="tooltip"
                          title="Save Item Note"
                          style="border-radius: 6px;"
                        >
                          Save
                        </button>
                        <button
                          type="button"
                          (click)="cancelItemNote()"
                          class="btn btn-outline-danger btn-sm"
                          data-bs-toggle="tooltip"
                          title="Cancel"
                          style="border-radius: 6px;"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="loader"
  class="loader-overlay"
>
  <div class="loader"></div>
</div>

<style>
  .loader-overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1050;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loader {
    border: 5px solid #f3f3f3;
    border-top: 5px solid red;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 2s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
