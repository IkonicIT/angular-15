<div class="animated fadeIn" *ngIf="itemRank > 0">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <p class="card-text">
            Manage Notes
            <button
              *ngIf="itemRank > 3"
              type="button"
              class="btn btn-primary float-end"
              data-bs-placement="bottom"
              data-bs-toggle="tooltip"
              title="Add Notes."
              (click)="addNotes()"
            >
              Add Notes
            </button>
          </p>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              Show
              <select [(ngModel)]="itemsForPagination" class="form-select d-inline w-auto">
                <option>5</option>
                <option>10</option>
                <option>25</option>
                <option>50</option>
              </select>
              entries
            </div>
            <div>
              Search:
              <input [(ngModel)]="itemNotesFilter" class="form-control d-inline w-auto" />
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover table-outline mb-0">
              <thead class="thead-light">
                <tr>
                  <th [class.active]="order === 'enteredOn'" (click)="setOrder('enteredOn')">
                    Date <span [hidden]="reverse == ''">▼</span><span [hidden]="reverse != ''">▲</span>
                  </th>
                  <th [class.active]="order === 'entityName'" (click)="setOrder('entityName')">
                    Title <span [hidden]="reverse == ''">▼</span><span [hidden]="reverse != ''">▲</span>
                  </th>
                  <th [class.active]="order === 'jobNumber'" (click)="setOrder('jobNumber')">
                    Job <span [hidden]="reverse == ''">▼</span><span [hidden]="reverse != ''">▲</span>
                  </th>
                  <th [class.active]="order === 'poNumber'" (click)="setOrder('poNumber')">
                    PO <span [hidden]="reverse == ''">▼</span><span [hidden]="reverse != ''">▲</span>
                  </th>
                  <th>Attachments</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  *ngFor="let note of notes | orderBy: reverse + order | filterBy: ['enteredOn','entityName','jobNumber','poNumber','enteredBy']:itemNotesFilter | paginate: { itemsPerPage: itemsForPagination, currentPage: p }"
                >
                  <td [innerHTML]="note.effectiveOn | date:'MM/dd/yyyy'"></td>
                  <td>
                    <a
                      href="javascript:void(0)"
                      (click)="openModalView(templateView, note.journalId)"
                      class="text-danger"
                      data-bs-toggle="tooltip"
                      title="Click to View Notes"
                      [innerHTML]="note.entityName"
                    ></a>
                  </td>
                  <td [innerHTML]="note.jobNumber"></td>
                  <td [innerHTML]="note.poNumber"></td>
                  <td>
                    <ng-container *ngFor="let attachment of note.attachmentList">
                      <br /><a
                        href="javascript:void(0)"
                        (click)="downloadFile(attachment)"
                        [innerHTML]="attachment.fileName"
                      ></a>
                    </ng-container>
                  </td>
                  <td>
                    <button
                      *ngIf="itemRank > 3"
                      type="button"
                      class="btn btn-outline-danger btn-sm me-1"
                      data-bs-toggle="tooltip"
                      title="Edit Item Note"
                      (click)="editItemNotes(note)"
                    >
                      Edit
                    </button>
                    <button
                      *ngIf="itemRank > 3"
                      type="button"
                      class="btn btn-outline-danger btn-sm"
                      data-bs-toggle="tooltip"
                      title="Delete Item Note"
                      (click)="openModal(confirmtemplate, note.journalId)"
                      [disabled]="highestRankNum == 9"
                    >
                      Delete
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <pagination-controls
            class="my-pagination"
            (pageChange)="p = $event"
            [autoHide]="true"
          ></pagination-controls>
        </div>
      </div>
    </div>
  </div>
  <div class="row mt-2">
    <div class="col-12 text-center">
      <button
        type="button"
        class="btn btn-outline-danger btn-sm me-1"
        style="border-radius: 6px;"
        (click)="back()"
      >
        Back
      </button>
      <button
        type="button"
        class="btn btn-primary"
        style="border-radius: 6px;"
        (click)="backToViewItem()"
      >
        Back To Item
      </button>
    </div>
  </div>
</div>

<ng-template #templateView>
  <div class="modal-header">
    <h4 class="modal-title">View Item Notes</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="modalRef?.hide()"></button>
  </div>
  <div class="modal-body">
    <div class="row">
      <div class="col-sm-6">
        <label for="title">Title</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="model.entityName"
          id="title"
          readonly
        />
      </div>
      <div class="col-sm-6">
        <label for="date">Date</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="model.effectiveOn"
          id="date"
          readonly
        />
      </div>
    </div>
    <div class="row mt-2">
      <div class="col-sm-6">
        <label for="job">JOB Number</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="model.jobNumber"
          id="job"
          readonly
        />
      </div>
      <div class="col-sm-6">
        <label for="po">PO Number</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="model.poNumber"
          id="po"
          readonly
        />
      </div>
    </div>
    <div class="row mt-2">
      <div class="col-12">
        <label for="details">Details</label>
        <textarea
          class="form-control"
          id="details"
          rows="2"
          [(ngModel)]="model.entry"
          readonly
        ></textarea>
      </div>
    </div>
    <div class="row mt-2">
      <div class="col-12 text-center">
        <button
          type="button"
          class="btn btn-outline-danger btn-sm"
          (click)="cancelViewItemNotes()"
        >
          Back
        </button>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #confirmtemplate>
  <div class="modal-body text-center">
    <p>Do you want to confirm?</p>
    <button type="button" class="btn btn-outline-danger btn-sm me-1" (click)="confirm()">Yes</button>
    <button type="button" class="btn btn-primary" (click)="decline()">No</button>
  </div>
</ng-template>

<div
  *ngIf="loader"
  style="position: fixed; width: 100%; height: 100%; top: 0; left: 0; background-color: rgba(0,0,0,0.5); z-index: 2;"
>
  <div class="loader"></div>
</div>

<style>
  .loader {
    position: fixed;
    left: 60%;
    top: 60%;
    z-index: 1;
    width: 60px;
    height: 60px;
    margin: -30px 0 0 -30px;
    border: 5px solid #f3f3f3;
    border-radius: 50%;
    border-top: 5px solid red;
    animation: spin 2s linear infinite;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
