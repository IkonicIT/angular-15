<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <p class="card-text">Edit Notes</p>

          <alert *ngIf="index > 0" type="success" [dismissible]="dismissible">
            Item Notes Updated successfully.
          </alert>

          <alert *ngIf="index === -1" type="danger" [dismissible]="dismissible">
            Please Enter Title and Date
          </alert>

          <div class="modal-body mobile-padding">
            <div class="col-sm-12 mobile-padding">
              <div class="card">
                <form #f="ngForm" novalidate>
                  <div class="card-body">
                    <div class="row">
                      <div class="form-group col-sm-6">
                        <label for="title">Title</label>
                        <input
                          type="text"
                          id="title"
                          name="title"
                          class="form-control"
                          placeholder="Enter Title"
                          [(ngModel)]="model.entityName"
                          #title="ngModel"
                          readonly
                        />
                      </div>
                      <div class="form-group col-sm-6">
                        <label for="date">Date</label>
                        <input
                          type="text"
                          id="date"
                          name="date"
                          class="form-control"
                          placeholder="Enter Date"
                          [(ngModel)]="model.enteredOn"
                          [bsConfig]="bsConfig"
                          #date="ngModel"
                          bsDatepicker
                          readonly
                        />
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-6">
                        <label for="job">JOB Number</label>
                        <input
                          type="number"
                          id="job"
                          name="job"
                          class="form-control"
                          placeholder="Enter JOB Number"
                          [(ngModel)]="model.jobNumber"
                          #job="ngModel"
                          readonly
                        />
                      </div>
                      <div class="form-group col-sm-6">
                        <label for="po">PO Number</label>
                        <input
                          type="number"
                          id="po"
                          name="po"
                          class="form-control"
                          placeholder="Enter PO Number"
                          [(ngModel)]="model.poNumber"
                          #po="ngModel"
                          readonly
                        />
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12">
                        <label for="details">Details</label>
                        <textarea
                          id="details"
                          name="details"
                          class="form-control"
                          placeholder="Enter Description"
                          rows="2"
                          cols="4"
                          [(ngModel)]="model.entry"
                          #details="ngModel"
                          readonly
                        ></textarea>
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12 text-center">
                        <button
                          type="button"
                          (click)="cancelItemNotes()"
                          class="btn btn-outline-danger btn-sm rounded"
                        >
                          Cancel
                        </button>
                        <button
                          type="button"
                          class="btn btn-outline-danger btn-sm rounded"
                          title="Back to View Item"
                          (click)="backToItem()"
                        >
                          Back To Item
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="loader" class="loader-overlay">
  <div class="loader"></div>
</div>

<style>
  .loader-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1050;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  .loader {
    border: 5px solid #f3f3f3;
    border-radius: 50%;
    border-top: 5px solid red;
    width: 60px;
    height: 60px;
    animation: spin 2s linear infinite;
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }

  .btn-sm.rounded {
    border-radius: 6px;
  }
</style>
