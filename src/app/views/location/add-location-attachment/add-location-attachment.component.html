<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <alert *ngIf="index > 0" type="success" [dismissible]="dismissible">
            Location Documents saved successfully.
          </alert>
          <alert *ngIf="index === -1" type="danger" [dismissible]="dismissible">
            Please Upload the file.
          </alert>

          <div class="modal-body mobile-padding">
            <div class="col-sm-12 mobile-padding">
              <div class="card">
                <div class="card-header">
                  <strong>Add Location Attachments</strong>
                </div>

                <form (ngSubmit)="saveLocationDocument()" #f="ngForm" novalidate>
                  <div class="card-body">
                    <div class="row">
                      <div class="form-group col-sm-12">
                        <label for="file">Add Document</label>
                        <input
                          type="file"
                          class="form-control"
                          id="file"
                          (change)="fileChangeListener($event)"
                        />
                        <input type="hidden" [(ngModel)]="model.added" name="added" />
                        <input type="hidden" [(ngModel)]="model.by" name="by" />
                        <input type="hidden" [(ngModel)]="model.locationId" name="locationId" />
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12">
                        <label for="desc">Description</label>
                        <textarea
                          id="desc"
                          rows="2"
                          class="form-control"
                          [(ngModel)]="model.description"
                          name="description"
                          placeholder="Enter Description"
                        ></textarea>
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12 text-center">
                        <button
                          type="submit"
                          class="btn btn-primary"
                          title="Save this Attachment"
                          data-bs-toggle="tooltip"
                          data-bs-placement="bottom"
                        >
                          Save
                        </button>
                        <button
                          type="button"
                          class="btn btn-primary"
                          title="Cancel"
                          data-bs-toggle="tooltip"
                          data-bs-placement="bottom"
                          (click)="cancelLocationDocument()"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  </div>
                </form>

              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="loader" class="loader-backdrop">
  <div class="loader"></div>
</div>

<style>
.loader-backdrop {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0,0,0,0.5);
  z-index: 2;
  cursor: pointer;
}

.loader {
  position: fixed;
  left: 60%;
  top: 60%;
  z-index: 3;
  width: 60px;
  height: 60px;
  border: 5px solid #f3f3f3;
  border-radius: 50%;
  border-top: 5px solid red;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}

.animate-bottom {
  position: relative;
  animation: animatebottom 1s;
}

@keyframes animatebottom {
  from { bottom: -100px; opacity: 0; }
  to { bottom: 0; opacity: 1; }
}

.btn-link[routerLink="/forgot-password"] {
  color: red;
}

.cent {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
