<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <alert *ngIf="index > 0" type="success" [dismissible]="dismissible">
            Location Attribute saved successfully.
          </alert>
          <alert *ngIf="index === -1" type="danger" [dismissible]="dismissible">
            Please Enter Location Attribute Name
          </alert>

          <div class="modal-body mobile-padding">
            <div class="col-sm-12 mobile-padding">
              <div class="card">
                <div class="card-header">
                  <strong>Add Location Attribute Details</strong>
                </div>

                <form (ngSubmit)="f.form.valid && saveLocationAttribute()" #f="ngForm" novalidate>
                  <div class="card-body">
                    <div class="row">
                      <div class="form-group col-sm-6">
                        <input type="hidden" [(ngModel)]="model._id" name="_id" />
                        <label for="name">Location Name</label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.name"
                          name="name"
                          id="name"
                          placeholder="Enter Location Attribute Name"
                        />
                      </div>

                      <div class="form-group col-sm-6">
                        <label for="type">Type Of Attribute</label>
                        <select
                          class="form-control custom-dropdown"
                          [(ngModel)]="model.type"
                          name="type"
                          id="type"
                        >
                          <option value="">Choose..</option>
                        </select>
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-6">
                        <label for="tooltip">Attribute Tooltip</label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.tooltip"
                          name="tooltip"
                          id="tooltip"
                        />
                      </div>

                      <div class="form-group col-sm-6">
                        <label for="listType">List Type Attribute condition</label>
                        <input
                          type="checkbox"
                          class="form-control"
                          [(ngModel)]="model.listType"
                          name="listType"
                          id="listType"
                        />
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-6">
                        <label for="searchType">Search Type</label>
                        <select
                          class="form-control custom-dropdown"
                          [(ngModel)]="model.searchType"
                          name="searchType"
                          id="searchType"
                        >
                          <option value="">Choose..</option>
                        </select>
                      </div>

                      <div class="form-group col-sm-6">
                        <label for="required">Required Field</label>
                        <input
                          type="checkbox"
                          class="form-control"
                          [(ngModel)]="model.required"
                          name="required"
                          id="required"
                        />
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12 text-center">
                        <button type="submit" class="btn btn-primary" style="border-radius: 6px;">Save</button>
                        <button
                          type="button"
                          [routerLink]="['../attributes']"
                          class="btn btn-outline-danger btn-sm"
                          style="border-radius: 6px;"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  </div>
                </form>

              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
