<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12 col-padding">
      <div class="card">
        <div class="card-body">

          <alert *ngIf="index > 0" type="success" [dismissible]="dismissible">
            Location Note Attachments saved successfully.
          </alert>
          <alert *ngIf="index === -1" type="danger" [dismissible]="dismissible">
            Please Upload the file.
          </alert>

          <div class="modal-body mobile-padding">
            <div class="col-sm-12 mobile-padding col-padding">
              <div class="card">
                <div class="card-header">
                  <strong>Add Location Note Attachments</strong>
                </div>

                <form (ngSubmit)="saveLocationNoteAttachment()" #f="ngForm" novalidate>
                  <div class="card-body">

                    <input type="hidden" [(ngModel)]="model.added" name="added" id="added" />
                    <input type="hidden" [(ngModel)]="model.by" name="by" id="by" />
                    <input type="hidden" [(ngModel)]="model._id" name="_id" id="_id" />
                    <input type="hidden" [(ngModel)]="model.companyId" name="companyId" id="companyId" />

                    <div style="overflow: auto;">
                      <table class="table table-bordered">
                        <thead>
                          <tr>
                            <th>File</th>
                            <th>Description</th>
                            <th></th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr *ngFor="let item of addedfiles; let i = index">
                            <td>
                              <input
                                type="file"
                                class="form-control"
                                (change)="fileChangeListener($event, i)"
                                id="file"
                              />
                            </td>
                            <td>
                              <textarea
                                class="form-control"
                                [(ngModel)]="item.description"
                                [name]="'description' + i"
                                rows="2"
                                cols="4"
                                placeholder="Enter Description"
                              ></textarea>
                            </td>
                            <td>
                              <button
                                *ngIf="i > 0"
                                type="button"
                                (click)="remove(i)"
                                data-bs-toggle="tooltip"
                                data-bs-placement="bottom"
                                title="Click here to remove File"
                              >
                                Remove
                              </button>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12 text-center">
                        <button
                          type="button"
                          (click)="addNewAttachment()"
                          data-bs-toggle="tooltip"
                          data-bs-placement="bottom"
                          title="Click here to Add File"
                        >
                          Add File
                        </button>
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12 text-center">
                        <button
                          type="submit"
                          class="btn btn-primary btn-right"
                          data-bs-toggle="tooltip"
                          data-bs-placement="bottom"
                          title="Save Note Attachment"
                          style="border-radius: 6px;"
                        >
                          Save
                        </button>
                        <button
                          type="button"
                          (click)="cancelLocationDocument()"
                          class="btn btn-primary"
                          data-bs-toggle="tooltip"
                          data-bs-placement="bottom"
                          title="Cancel"
                          style="border-radius: 6px;"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>

                  </div>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="loader" class="loader-backdrop">
  <div class="loader"></div>
</div>

<style>
.loader-backdrop {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  background-color: rgba(0,0,0,0.5);
  z-index: 2;
  cursor: pointer;
}

.loader {
  position: fixed;
  left: 60%;
  top: 60%;
  z-index: 3;
  width: 60px;
  height: 60px;
  border: 5px solid #f3f3f3;
  border-radius: 50%;
  border-top: 5px solid red;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}

.animate-bottom {
  position: relative;
  animation: animatebottom 1s;
}

@keyframes animatebottom {
  from { bottom: -100px; opacity: 0; }
  to { bottom: 0; opacity: 1; }
}
</style>
