<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <p class="card-text">Add Notes</p>

          <alert *ngIf="index > 0" type="success" [dismissible]="dismissible">
            Location Notes saved successfully.
          </alert>
          <alert *ngIf="index === -1" type="danger" [dismissible]="dismissible">
            Please Enter Title and Date
          </alert>

          <div class="modal-body mobile-padding">
            <div class="col-sm-12 mobile-padding">
              <div class="card">
                <form (ngSubmit)="f.form.valid && saveLocationNote()" #f="ngForm" novalidate>
                  <div class="card-body">
                    <div class="row">
                      <div class="form-group col-sm-6">
                        <input type="hidden" [(ngModel)]="model.journalId" name="journalId" id="_id" />
                        <label for="title">Title <strong class="text-danger">*</strong></label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.entityName"
                          name="title"
                          id="title"
                          placeholder="Enter Title"
                        />
                      </div>

                      <div class="form-group col-sm-6">
                        <label for="date">Date <strong class="text-danger">*</strong></label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.effectiveOn"
                          name="date"
                          id="date"
                          placeholder="Enter Date"
                          [bsConfig]="bsConfig"
                          bsDatepicker
                        />
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-6">
                        <label for="job">JOB Number</label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.jobNumber"
                          name="job"
                          id="job"
                          placeholder="Enter JOB Number"
                        />
                      </div>

                      <div class="form-group col-sm-6">
                        <label for="po">PO Number</label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.poNumber"
                          name="po"
                          id="po"
                          placeholder="Enter PO Number"
                        />
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12">
                        <label for="details">Details</label>
                        <textarea
                          class="form-control"
                          [(ngModel)]="model.entry"
                          name="details"
                          id="details"
                          rows="2"
                          cols="4"
                          placeholder="Enter Description"
                        ></textarea>
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12 text-center">
                        <button
                          type="submit"
                          class="btn btn-primary"
                          data-bs-toggle="tooltip"
                          data-bs-placement="bottom"
                          title="Save Location Note"
                          style="border-radius: 6px;"
                        >
                          Save
                        </button>
                        <button
                          type="button"
                          (click)="cancelLocationNote()"
                          class="btn btn-outline-danger btn-sm"
                          data-bs-toggle="tooltip"
                          data-bs-placement="bottom"
                          title="Cancel"
                          style="border-radius: 6px;"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>

                  </div>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="loader" class="loader-backdrop">
  <div class="loader"></div>
</div>

<style>
.loader-backdrop {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  background-color: rgba(0,0,0,0.5);
  z-index: 2;
  cursor: pointer;
}

.loader {
  position: fixed;
  left: 60%;
  top: 60%;
  z-index: 3;
  width: 60px;
  height: 60px;
  border: 5px solid #f3f3f3;
  border-radius: 50%;
  border-top: 5px solid red;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}

.animate-bottom {
  position: relative;
  animation: animatebottom 1s;
}

@keyframes animatebottom {
  from { bottom: -100px; opacity: 0; }
  to { bottom: 0; opacity: 1; }
}
</style>
