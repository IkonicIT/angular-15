<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <p class="card-text">Edit Location Attachments</p>

          <alert *ngIf="index > 0" type="success" [dismissible]="dismissible">
            Location Documents Updated successfully.
          </alert>
          <alert *ngIf="index === -1" type="danger" [dismissible]="dismissible">
            Please Upload the file.
          </alert>

          <div class="modal-body mobile-padding">
            <div class="col-sm-12 mobile-padding">
              <div class="card">
                <form (ngSubmit)="f.form.valid && updateLocationDocument()" #f="ngForm" novalidate>
                  <div class="card-body">
                    <input type="file" class="form-control" id="logo" name="logo" hidden />
                    <input type="hidden" [(ngModel)]="model.dateAdded" name="added" id="added" #added="ngModel" />
                    <input type="hidden" [(ngModel)]="model.addedBy" name="by" id="by" #by="ngModel" />
                    <input type="hidden" [(ngModel)]="model.attachmentId" name="_id" id="_id" #_id="ngModel" />
                    <input type="hidden" [(ngModel)]="model.entityId" name="locationId" id="locationId" #locationId="ngModel" />

                    <div class="row">
                      <div class="form-group col-sm-12">
                        <label for="desc">Description</label>
                        <textarea
                          id="desc"
                          class="form-control"
                          rows="2"
                          [(ngModel)]="model.description"
                          name="description"
                          #description="ngModel"
                          placeholder="Enter Description"
                        ></textarea>
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12 text-center">
                        <button
                          type="submit"
                          class="btn btn-primary"
                          data-bs-toggle="tooltip"
                          data-bs-placement="bottom"
                          title="Update this Attachment"
                        >
                          Update
                        </button>
                        <button
                          type="button"
                          (click)="cancelLocationDocument()"
                          class="btn btn-primary"
                          data-bs-toggle="tooltip"
                          data-bs-placement="bottom"
                          title="Cancel"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="loader" class="loader-backdrop">
  <div class="loader"></div>
</div>

<style>
.loader-backdrop {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  background-color: rgba(0,0,0,0.5);
  z-index: 2;
  cursor: pointer;
}

.loader {
  position: fixed;
  left: 60%;
  top: 60%;
  z-index: 3;
  width: 60px;
  height: 60px;
  border: 5px solid #f3f3f3;
  border-radius: 50%;
  border-top: 5px solid red;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}

.animate-bottom {
  position: relative;
  animation: animatebottom 1s;
}

@keyframes animatebottom {
  from { bottom: -100px; opacity: 0; }
  to { bottom: 0; opacity: 1; }
}
</style>
