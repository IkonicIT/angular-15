<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12 col-padding">
      <div class="card">
        <div class="card-body">
          <p class="card-text">Edit Location Note Attachments</p>

          <alert *ngIf="index > 0" type="success" [dismissible]="dismissible">
            Location Notes attachments Updated successfully.
          </alert>

          <div class="modal-body mobile-padding">
            <div class="col-sm-12 mobile-padding col-padding">
              <div class="card">
                <form #f="ngForm" (ngSubmit)="f.form.valid && updateLocationNoteAttachment()" novalidate>
                  <div class="card-body">
                    <div class="row">
                      <div class="form-group col-sm-12">
                        <label for="desc">Description</label>
                        <textarea
                          id="desc"
                          rows="2"
                          cols="4"
                          class="form-control"
                          [(ngModel)]="model.description"
                          name="description"
                          #description="ngModel"
                          placeholder="Enter Description"
                        ></textarea>
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12 text-center">
                        <button
                          type="submit"
                          data-bs-placement="bottom"
                          data-bs-toggle="tooltip"
                          title="Update Document"
                          class="btn btn-primary btn-right"
                        >
                          Update
                        </button>
                        <button
                          type="button"
                          (click)="cancel()"
                          data-bs-placement="bottom"
                          data-bs-toggle="tooltip"
                          title="Cancel"
                          class="btn btn-outline-danger btn-sm"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>

                  </div>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="loader"
  style="position: fixed; width: 100%; height: 100%; top: 0; left: 0; background-color: rgba(0,0,0,0.5); z-index: 2; cursor: pointer;"
>
  <div class="loader"></div>
</div>

<style>
.loader {
  position: fixed;
  left: 60%;
  top: 60%;
  z-index: 1;
  width: 60px;
  height: 60px;
  border: 5px solid #f3f3f3;
  border-radius: 50%;
  border-top: 5px solid red;
  animation: spin 2s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
