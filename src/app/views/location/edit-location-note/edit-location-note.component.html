<div class="animated fadeIn">
  <div class="row">
    <div class="col-lg-12">
      <div class="card">
        <div class="card-body">
          <p class="card-text">Edit Location Notes</p>

          <alert *ngIf="index > 0" type="success" [dismissible]="dismissible">
            Location Notes Updated successfully.
          </alert>
          <alert *ngIf="index === -1" type="danger" [dismissible]="dismissible">
            Please Enter Title and Date
          </alert>

          <div class="modal-body mobile-padding">
            <div class="col-sm-12 mobile-padding">
              <div class="card">
                <form #f="ngForm" (ngSubmit)="f.form.valid && updateLocationNotes()" novalidate>
                  <div class="card-body">
                    <div class="row">
                      <div class="form-group col-sm-6">
                        <input type="hidden" [(ngModel)]="model._id" name="journalId" #_id="ngModel" id="_id" />
                        <label for="title">Title <strong class="text-danger">*</strong></label>
                        <input
                          type="text"
                          readonly
                          class="form-control"
                          [(ngModel)]="model.entityName"
                          name="title"
                          #title="ngModel"
                          id="title"
                        />
                      </div>
                      <div class="form-group col-sm-6">
                        <label for="date">Date <strong class="text-danger">*</strong></label>
                        <input
                          type="text"
                          readonly
                          class="form-control"
                          [(ngModel)]="model.effectiveOn"
                          name="date"
                          #date="ngModel"
                          id="date"
                        />
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-6">
                        <label for="job">JOB Number</label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.jobNumber"
                          name="job"
                          #job="ngModel"
                          id="job"
                          placeholder="Enter JOB Number"
                        />
                      </div>
                      <div class="form-group col-sm-6">
                        <label for="po">PO Number</label>
                        <input
                          type="text"
                          class="form-control"
                          [(ngModel)]="model.poNumber"
                          id="po"
                          name="po"
                          #po="ngModel"
                          placeholder="Enter PO Number"
                        />
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12">
                        <label for="details">Details</label>
                        <textarea
                          id="details"
                          rows="2"
                          cols="4"
                          class="form-control"
                          [(ngModel)]="model.entry"
                          name="details"
                          #details="ngModel"
                          placeholder="Enter Description"
                        ></textarea>
                      </div>
                    </div>

                    <div class="row">
                      <div class="form-group col-sm-12 text-center">
                        <button
                          data-bs-placement="bottom"
                          data-bs-toggle="tooltip"
                          title="Update Company Note"
                          class="btn btn-primary"
                        >
                          Update
                        </button>
                        <button
                          type="button"
                          data-bs-placement="bottom"
                          data-bs-toggle="tooltip"
                          title="Cancel"
                          (click)="cancelLocationNotes()"
                          class="btn btn-outline-danger btn-sm"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="loader"
  style="position: fixed; width: 100%; height: 100%; top: 0; left: 0; background-color: rgba(0,0,0,0.5); z-index: 2; cursor: pointer;"
>
  <div class="loader"></div>
</div>

<style>
.loader {
  position: fixed;
  left: 60%;
  top: 60%;
  z-index: 1;
  width: 60px;
  height: 60px;
  border: 5px solid #f3f3f3;
  border-radius: 50%;
  border-top: 5px solid red;
  animation: spin 2s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
