<div class="animated fadeIn" *ngIf="highestRank > 4">
  <div class="row">
    <div class="col-lg-12 col-padding">
      <div class="card">
        <div class="card-body">
          <p class="card-text">
            Manage Notes
            <button
              type="button"
              class="btn btn-primary float-right"
              data-bs-toggle="tooltip"
              title="Add Notes."
              (click)="addNotes()"
            >
              Add Notes
            </button>
          </p>

          <div class="float-left">
            <span>
              Show
              <select [(ngModel)]="itemsForPagination">
                <option>5</option>
                <option>10</option>
                <option>25</option>
                <option>50</option>
              </select>
              entries
            </span>
          </div>

          <div class="float-right div-search">
            <span>Search : </span>
            <input [(ngModel)]="locationNotesFilter" />
          </div>

          <table class="table table-responsive-sm table-hover table-outline mb-0">
            <thead class="thead-light">
              <tr>
                <th [class.active]="order === 'effectiveOn'" (click)="setOrder('effectiveOn')">
                  Date <span [hidden]="reverse === ''">▼</span><span [hidden]="reverse !== ''">▲</span>
                </th>
                <th [class.active]="order === 'entityName'" (click)="setOrder('entityName')">
                  Title <span [hidden]="reverse === ''">▼</span><span [hidden]="reverse !== ''">▲</span>
                </th>
                <th [class.active]="order === 'jobNumber'" (click)="setOrder('jobNumber')">
                  Job <span [hidden]="reverse === ''">▼</span><span [hidden]="reverse !== ''">▲</span>
                </th>
                <th [class.active]="order === 'poNumber'" (click)="setOrder('poNumber')">
                  PO <span [hidden]="reverse === ''">▼</span><span [hidden]="reverse !== ''">▲</span>
                </th>
                <th [class.active]="order === 'enteredBy'" (click)="setOrder('enteredBy')">
                  By <span [hidden]="reverse === ''">▼</span><span [hidden]="reverse !== ''">▲</span>
                </th>
                <th>Attachments</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr
                *ngFor="
                  let note of notes
                    | orderBy: reverse + order
                    | filterBy: ['effectiveOn', 'entityName', 'jobNumber', 'poNumber', 'enteredBy']: locationNotesFilter
                    | paginate: { itemsPerPage: itemsForPagination, currentPage: p }
                "
              >
                <td>{{ note.effectiveOn | date:'MM/dd/yyyy' }}</td>
                <td>
                  <a
                    href="javascript:void(0)"
                    (click)="openModalView(templateView, note.journalId)"
                    style="color: red"
                    data-bs-toggle="tooltip"
                    title="Click here to View Notes Screen"
                  >
                    {{ note.entityName }}
                  </a>
                </td>
                <td>{{ note.jobNumber }}</td>
                <td>{{ note.poNumber }}</td>
                <td>{{ note.enteredBy }}</td>
                <td>
                  <button
                    type="button"
                    class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="tooltip"
                    title="Note Attachments"
                    (click)="locationNoteAttachments(note)"
                  >
                    Attachments
                  </button>
                </td>
                <td>
                  <button
                    type="button"
                    class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="tooltip"
                    title="Update Note"
                    (click)="editLocationNotes(note)"
                  >
                    Edit
                  </button>
                  <button
                    type="button"
                    class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="tooltip"
                    title="Delete Note"
                    (click)="openModal(confirmtemplate, note.journalId)"
                    [disabled]="highestRank === 9"
                  >
                    Delete
                  </button>
                </td>
              </tr>
            </tbody>
          </table>

          <pagination-controls
            class="my-pagination"
            (pageChange)="p = $event"
            [autoHide]="true"
          ></pagination-controls>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: View Note -->
<ng-template #templateView>
  <div class="modal-header">
    <h4 class="modal-title pull-left">View Location Notes</h4>
    <button
      type="button"
      class="close pull-right"
      aria-label="Close"
      (click)="modalRef?.hide()"
    >
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body">
    <div class="row">
      <div class="form-group col-sm-6">
        <label for="title">Title</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="model.entityName"
          id="title"
          readonly
        />
      </div>
      <div class="form-group col-sm-6">
        <label for="date">Date</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="model.effectiveOn"
          id="date"
          readonly
        />
      </div>
    </div>

    <div class="row">
      <div class="form-group col-sm-6">
        <label for="job">JOB Number</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="model.jobNumber"
          id="job"
          readonly
        />
      </div>
      <div class="form-group col-sm-6">
        <label for="po">PO Number</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="model.poNumber"
          id="po"
          readonly
        />
      </div>
    </div>

    <div class="row">
      <div class="form-group col-sm-12">
        <label for="details">Details</label>
        <textarea
          id="details"
          class="form-control"
          [(ngModel)]="model.entry"
          rows="2"
          readonly
        ></textarea>
      </div>
    </div>

    <div class="row">
      <div class="form-group col-sm-12 text-center">
        <button
          type="button"
          (click)="cancelViewLocationNotes()"
          class="btn btn-outline-danger btn-sm"
        >
          Back
        </button>
      </div>
    </div>
  </div>
</ng-template>

<!-- Modal: Confirm Delete -->
<ng-template #confirmtemplate>
  <div class="modal-body text-center">
    <p>Do you want to confirm?</p>
    <button type="button" class="btn btn-outline-danger btn-sm" (click)="confirm()">Yes</button>
    <button type="button" class="btn btn-primary" (click)="decline()">No</button>
  </div>
</ng-template>

<!-- Loader -->
<div
  *ngIf="loader"
  style="position: fixed; width:100%; height:100%; top:0; left:0; background-color: rgba(0,0,0,0.5); z-index:2; cursor:pointer;"
>
  <div class="loader"></div>
</div>

<style>
.loader {
  position: fixed;
  left: 60%;
  top: 60%;
  width: 60px;
  height: 60px;
  border: 5px solid #f3f3f3;
  border-radius: 50%;
  border-top: 5px solid red;
  animation: spin 2s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
